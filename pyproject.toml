[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "state-guard"
version = "2.0.0"
description = "Framework de memoria transaccional para agentes LLM (MCP)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["mcp>=1.0.0,<2.0.0"]

[project.scripts]
state-guard-mcp = "scripts.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
